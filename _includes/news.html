<section class="well news-panel">
  <h2>News</h2>
  {% for item in site.data.news limit:3 %}
  <article class="news-item">
    <p class="news-date">{{ item.date_label }}</p>
    <p>{{ item.text }}</p>
    <a href="{{ item.url | relative_url }}">{% if item.url contains 'publication' %}Publication{% else %}Read more{% endif %} <span aria-hidden="true">→</span></a>
  </article>
  {% endfor %}
  <a class="all-news" href="{{ '/news/' | relative_url }}">All news <span aria-hidden="true">→</span></a>
</section>
