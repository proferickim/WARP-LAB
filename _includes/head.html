<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != 'Home' %}{{ page.title | escape }} · {% endif %}{{ site.title }} · {{ site.institution }}</title>
  <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | escape }}">
  <meta name="theme-color" content="#143759">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }} · WARP Lab">
  <meta property="og:description" content="{{ site.description | escape }}">
  <meta property="og:type" content="website">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="preload" href="{{ '/fonts/SUIT-Variable.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}">
  <link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml">
</head>
